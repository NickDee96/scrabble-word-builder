services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scrabble-backend
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - scrabble-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scrabble-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - scrabble-network

networks:
  scrabble-network:
    driver: bridge

volumes:
  # Optional: create a named volume for any persistent data
  scrabble-data:
