services:
  backend:
    environment:
      - ENVIRONMENT=development
    volumes:
      # Mount source code for development
      - "./app.py:/app/app.py"
      - "./scrabble.py:/app/scrabble.py"
      - "./scrabble_engine.py:/app/scrabble_engine.py"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5000", "--reload"]

  frontend:
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:5000
    volumes:
      # Mount source code for development
      - "./frontend:/app"
      - "/app/node_modules"
      - "/app/.next"
    command: ["npm", "run", "dev"]
